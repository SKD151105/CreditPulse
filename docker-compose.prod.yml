version: '3.8'

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/creditpulse-server:latest
    ports:
      - "5000:5000"
    env_file: .env.prod
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/creditpulse-server:latest
    command: node dist/worker.js
    env_file: .env.prod
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
