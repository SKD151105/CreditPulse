name: Deploy to Production
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ghcr.io/skd151105/creditpulse-server:latest
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # 1. Securely create the .env.prod file on the server using the GitHub Secret
            echo "${{ secrets.PROD_ENV_FILE }}" > .env.prod
            
            # 2. Generate the docker-compose file on the server
            cat << 'EOF' > docker-compose.prod.yml
            version: '3.8'
            services:
              redis:
                image: redis:7-alpine
                restart: always
                ports:
                  - "6379:6379"
              api:
                image: ghcr.io/skd151105/creditpulse-server:latest
                ports:
                  - "5000:5000"
                env_file: .env.prod
                environment:
                  - REDIS_URI=redis://redis:6379
                restart: always
                depends_on:
                  - redis
                dns:
                  - 8.8.8.8
                  - 8.8.4.4
              worker:
                image: ghcr.io/skd151105/creditpulse-server:latest
                command: node dist/worker.js
                env_file: .env.prod
                environment:
                  - REDIS_URI=redis://redis:6379
                restart: always
                depends_on:
                  - redis
                dns:
                  - 8.8.8.8
                  - 8.8.4.4
            EOF
            
            # 3. Clean up space, pull the new image, and restart the containers
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker system prune -af --volumes
            docker pull ghcr.io/skd151105/creditpulse-server:latest
            docker compose -f docker-compose.prod.yml up -d

